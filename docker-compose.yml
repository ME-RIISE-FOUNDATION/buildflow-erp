version: '3.8'

services:
  # Frontend - Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildflow-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - buildflow-network

  # Backend - Laravel
  backend:
    image: php:8.3-fpm
    container_name: buildflow-backend
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: buildflow
      DB_USERNAME: buildflow
      DB_PASSWORD: password
    depends_on:
      - mysql
    networks:
      - buildflow-network

  # Nginx - Web Server
  nginx:
    image: nginx:alpine
    container_name: buildflow-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api:/app
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - buildflow-network

  # MySQL - Database
  mysql:
    image: mysql:8.0
    container_name: buildflow-mysql
    environment:
      MYSQL_DATABASE: buildflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: buildflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - buildflow-network

networks:
  buildflow-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
